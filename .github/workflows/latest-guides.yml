name: Latest guides
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/update-latest.mjs
      - name: Commit when the list changed
        run: |
          git diff --quiet && exit 0
          git -c user.name="Cloudsoft Zone" -c user.email="contact@cloudsoftzone.com" commit -am "Update latest guides"
          git push
